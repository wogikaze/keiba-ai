[project]
name = "keiba-ai"
version = "0.1.0"
description = "競馬予測AIの研究"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
ml = ["pandas>=2.2", "lightgbm>=4.5", "scikit-learn>=1.5"]
ocr = [
    "onnxruntime>=1.31.1",
    "rapidocr>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keiba_ai"]
